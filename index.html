<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Diary</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <h1>My Diary</h1>

  <div id="moodSelector" class="moodboard">
    <button data-value="Great">😃<div>Great</div></button>
    <button data-value="Good">😊<div>Good</div></button>
    <button data-value="Okay">😐<div>Okay</div></button>
    <button data-value="Down">😔<div>Down</div></button>
    <button data-value="Sad">😢<div>Sad</div></button>
  </div>

  <textarea id="entry" placeholder="Write your thoughts..."></textarea>
  <button id="saveBtn">Save Entry</button>

  <h2>Previous Entries</h2>
  <ul id="entriesList"></ul>

  <script src="app.js"></script>
</body>
</html>
