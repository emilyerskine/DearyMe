<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DearyMe</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <!-- Main Content -->
  <div id="content">
    <!-- Journaling Section -->
    <div id="journalingSection" class="section active">
      <h1>DearyMe - Journaling</h1>
      
      <div id="step1" class="step">
        <h2>How are you feeling?</h2>
        <div id="moodSelector" class="moodboard">
          <button data-value="Great">😃</button>
          <button data-value="Good">😊</button>
          <button data-value="Okay">😐</button>
          <button data-value="Down">😔</button>
          <button data-value="Sad">😢</button>
        </div>
        <button id="next1" class="next-btn">Next</button>
      </div>

      <div id="step2" class="step">
        <h2>Any symptoms you want to log?</h2>
        <div class="multi" id="symptomsMulti">
          <div class="multi-display">Select symptoms</div>
          <div class="multi-options hidden"></div>
        </div>
        <button id="next2" class="next-btn">Next</button>
        <button id="back1" class="back-btn">Back</button>
      </div>

      <div id="step3" class="step">
        <h2>Any recent behaviours you want to log?</h2>
        <div class="multi" id="behavioursMulti">
          <div class="multi-display">Select behaviours</div>
          <div class="multi-options hidden"></div>
        </div>
        <button id="next3" class="next-btn">Next</button>
        <button id="back2" class="back-btn">Back</button>
      </div>

      <div id="step4" class="step">
        <textarea id="entry" placeholder="Write your thoughts..."></textarea>
        <button id="saveBtn" class="save-btn">Save Entry</button>
      </div>

      <h2>Previous Entries</h2>
      <ul id="entriesList"></ul>
    </div>

    <!-- Settings Section -->
    <div id="settingsSection" class="section hidden">
      <h1>Settings</h1>
      <p>Settings content goes here.</p>
    </div>

    <!-- Account Section -->
    <div id="accountSection" class="section hidden">
      <h1>Account</h1>
      <p>Account content goes here.</p>
    </div>
  </div>

  <!-- Bottom NavBar -->
  <nav id="bottomNav">
    <button id="journalingNav" class="nav-btn">Journaling</button>
    <button id="settingsNav" class="nav-btn">Settings</button>
    <button id="accountNav" class="nav-btn">Account</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
